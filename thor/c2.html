<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>THOR Tracker | Command Center</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="THOR Tracker">
    <meta name="theme-color" content="#111827">
    <link rel="apple-touch-icon" href="thor_tracker.jpeg">
    <link rel="manifest" href="manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Base Styling */
        :root {
            --bg-primary: #111827; /* gray-900 */
            --bg-secondary: rgba(31, 41, 55, 0.5); /* gray-800/50 */
            --border-color: rgba(55, 65, 81, 0.5); /* gray-700/50 */
            --accent-cyan: #00BFFF;
            --accent-gold: #FFD700;
            --text-primary: #F3F4F6; /* gray-100 */
            --text-secondary: #9CA3AF; /* gray-400 */
        }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-secondary);
            background-image: radial-gradient(circle at top right, rgba(0, 191, 255, 0.08), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(168, 85, 247, 0.08), transparent 50%);
        }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }

        /* Glassmorphism Card Effect */
        .glass-card {
            background: var(--bg-secondary);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            position: relative;
        }
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg, rgba(0, 191, 255, 0.2), rgba(168, 85, 247, 0.2));
            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
        @keyframes item-enter {
            0% { opacity: 0; transform: scale(0.95) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .item-enter { animation: item-enter 0.5s ease-out backwards; }

        /* Sidebar Navigation */
        .sidebar-btn {
            color: var(--text-secondary);
            border-left: 3px solid transparent;
            transition: all 0.2s ease-in-out;
        }
        .sidebar-btn:hover {
            background-color: rgba(55, 65, 81, 0.3);
            color: var(--text-primary);
        }
        .sidebar-btn.active {
            color: var(--accent-cyan);
            border-left-color: var(--accent-cyan);
            background-color: rgba(0, 191, 255, 0.1);
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #64748b; }

        /* Right Detail Panel */
        #detail-panel {
            animation: slideInRight 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        /* Floating Action Button */
        #fab-container.open #fab { transform: rotate(45deg); background-color: #dc2626; } /* red-600 */
        .fab-option { transition: all 0.3s ease; transform: scale(0); transform-origin: bottom right; }
        #fab-container.open .fab-option { transform: scale(1); }
        #fab-container.open .fab-option:nth-child(1) { transition-delay: 0.1s; }
        #fab-container.open .fab-option:nth-child(2) { transition-delay: 0.15s; }
        #fab-container.open .fab-option:nth-child(3) { transition-delay: 0.2s; }

        /* Login & Auth State */
        .admin-control { display: none !important; }
        body.logged-in .admin-control { display: flex !important; } /* Use flex or block as needed */
        body.logged-out .login-button { display: inline-flex !important; }
        body.logged-in .login-button { display: none !important; }
        body.logged-out .logout-button { display: none !important; }
        body.logged-in .logout-button { display: inline-flex !important; }

        /* Loading Spinner */
        .loader {
            border: 4px solid #334155; /* border-slate-700 */
            border-top: 4px solid var(--accent-cyan);
            border-radius: 50%; width: 50px; height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body class="logged-out">

    <canvas id="confetti-canvas" class="fixed top-0 left-0 w-full h-full pointer-events-none z-[100]"></canvas>

    <div id="loading-overlay" class="fixed inset-0 bg-gray-900/80 backdrop-blur-sm flex flex-col items-center justify-center z-50 transition-opacity duration-300">
        <div class="loader"></div>
        <p class="mt-4 text-lg text-slate-300">Connecting to Command Center...</p>
    </div>

    <div class="h-full flex">
        <aside class="hidden lg:flex flex-col w-64 flex-shrink-0 bg-gray-900/30 border-r border-gray-700/50 p-4">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-white font-orbitron">THOR Tracker</h1>
                <p class="text-xs text-cyan-400">Command Center</p>
            </div>
            <nav id="desktop-nav" class="flex-grow space-y-2">
                <button data-view="dashboard" class="sidebar-btn active w-full flex items-center p-3 rounded-lg space-x-3">
                    <i class="fa-solid fa-table-columns w-5 text-center"></i>
                    <span class="font-semibold">Dashboard</span>
                </button>
                <button data-view="members" class="sidebar-btn w-full flex items-center p-3 rounded-lg space-x-3">
                    <i class="fa-solid fa-users w-5 text-center"></i>
                    <span class="font-semibold">Members</span>
                </button>
                <button data-view="history" class="sidebar-btn w-full flex items-center p-3 rounded-lg space-x-3">
                    <i class="fa-solid fa-clock-rotate-left w-5 text-center"></i>
                    <span class="font-semibold">History</span>
                </button>
                <button data-view="medals" class="sidebar-btn w-full flex items-center p-3 rounded-lg space-x-3">
                    <i class="fa-solid fa-medal w-5 text-center"></i>
                    <span class="font-semibold">Medals</span>
                </button>
            </nav>
            <div class="mt-auto flex flex-col items-center space-y-4">
                 <button id="how-it-works-button" class="text-slate-400 hover:text-cyan-400 text-sm transition-colors flex items-center space-x-2">
                    <i class="fa-solid fa-circle-question w-4 h-4"></i>
                    <span>How It Works</span>
                </button>
                <button id="logout-button" class="logout-button w-full bg-red-600/80 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg text-sm transition-colors">Logout</button>
                <button id="open-login-modal-btn" class="login-button w-full bg-slate-600/80 hover:bg-slate-600 text-white font-bold py-2 px-4 rounded-lg text-sm transition-colors">Admin Login</button>
            </div>
        </aside>

        <main class="w-full flex-grow flex flex-col p-4 lg:p-6 min-h-0">
            <div id="view-dashboard" class="view-content h-full">Dashboard Content</div>
            <div id="view-members" class="view-content hidden h-full">Members Content</div>
            <div id="view-history" class="view-content hidden h-full">History Content</div>
            <div id="view-medals" class="view-content hidden h-full">Medals Content</div>
        </main>

        <aside id="detail-panel-container" class="hidden absolute top-0 right-0 h-full w-full lg:w-96 p-4">
             <div id="detail-panel" class="glass-card rounded-2xl w-full h-full flex flex-col overflow-hidden">
                </div>
        </aside>

        <div id="fab-container" class="admin-control fixed bottom-6 right-6 lg:hidden">
            <div class="fab-options flex flex-col items-end gap-3 mb-3">
                <button id="open-add-member-panel-btn" class="fab-option bg-cyan-500 text-white w-10 h-10 rounded-full shadow-lg flex items-center justify-center" title="Add Member">
                    <i class="fa-solid fa-user-plus"></i>
                </button>
                <button id="open-award-medal-panel-btn" class="fab-option bg-purple-500 text-white w-10 h-10 rounded-full shadow-lg flex items-center justify-center" title="Award Medal">
                    <i class="fa-solid fa-medal"></i>
                </button>
                 <button id="settings-button-mobile" class="fab-option bg-gray-500 text-white w-10 h-10 rounded-full shadow-lg flex items-center justify-center" title="Settings">
                    <i class="fa-solid fa-cog"></i>
                </button>
            </div>
            <button id="fab" class="bg-cyan-600 hover:bg-cyan-700 text-white w-14 h-14 rounded-full shadow-xl flex items-center justify-center transition-transform">
                <i class="fa-solid fa-plus text-xl"></i>
            </button>
        </div>
    </div>


    <div id="login-modal" class="modal-overlay hidden fixed inset-0 bg-gray-950/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="glass-card p-6 w-full max-w-sm rounded-2xl">
            <h2 class="text-xl font-bold text-white mb-4 text-center">Admin Login</h2>
            <div class="space-y-4">
                <div>
                    <label for="password-input" class="block text-sm font-medium text-slate-300">Password</label>
                    <input type="password" id="password-input" class="mt-1 w-full bg-slate-700/50 border border-slate-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-400">
                </div>
                <p id="login-error-msg" class="text-xs text-red-400 h-4 text-center"></p>
            </div>
            <div class="mt-6 flex justify-end space-x-3">
                <button id="cancel-login-btn" class="bg-slate-600 hover:bg-slate-500 text-white font-bold py-2 px-4 rounded-lg text-sm">Cancel</button>
                <button id="login-button" class="bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-2 px-4 rounded-lg text-sm">Login</button>
            </div>
        </div>
    </div>
    
     <div id="confirmation-modal" class="modal-overlay hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="glass-card p-6 w-full max-w-sm text-center rounded-2xl">
            <h2 id="confirmation-title" class="text-lg font-bold text-white mb-4">Are you sure?</h2>
            <p id="confirmation-message" class="text-sm text-slate-300 mb-6">This action cannot be undone.</p>
            <div class="flex justify-center space-x-4">
                <button id="confirm-cancel-btn" class="bg-slate-600 hover:bg-slate-500 text-white font-bold py-2 px-6 rounded-lg text-sm">Cancel</button>
                <button id="confirm-action-btn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded-lg text-sm">Confirm</button>
            </div>
        </div>
    </div>


    <template id="dashboard-view-template">
       Dashboard
    </template>
    
    <template id="members-view-template">
        Members
    </template>

    <template id="history-view-template">
       History
    </template>

    <template id="medals-view-template">
        Medals
    </template>

    <template id="member-detail-template">
       Member Detail
    </template>

    <template id="add-member-template">
       Add Member
    </template>
    
    <script>
    // --- INITIALIZATION ---
    document.addEventListener('DOMContentLoaded', () => {
        const fab = document.getElementById('fab');
        const fabContainer = document.getElementById('fab-container');
        
        fab.addEventListener('click', () => {
            fabContainer.classList.toggle('open');
        });

        // Add event listeners for modal controls
        document.getElementById('open-login-modal-btn').addEventListener('click', () => {
            document.getElementById('login-modal').classList.remove('hidden');
        });
        document.getElementById('cancel-login-btn').addEventListener('click', () => {
            document.getElementById('login-modal').classList.add('hidden');
        });

        // Mock login functionality for demo
        document.getElementById('login-button').addEventListener('click', () => {
            if (document.getElementById('password-input').value === 'newspaper') {
                document.body.classList.remove('logged-out');
                document.body.classList.add('logged-in');
                document.getElementById('login-modal').classList.add('hidden');
            } else {
                 document.getElementById('login-error-msg').textContent = 'Invalid password.';
                 setTimeout(() =>  document.getElementById('login-error-msg').textContent = '', 3000);
            }
        });
         document.getElementById('logout-button').addEventListener('click', () => {
            document.body.classList.add('logged-out');
            document.body.classList.remove('logged-in');
        });

        // View switching logic
        const navButtons = document.querySelectorAll('#desktop-nav button');
        const views = document.querySelectorAll('.view-content');

        navButtons.forEach(button => {
            button.addEventListener('click', () => {
                const targetView = button.dataset.view;

                navButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');

                views.forEach(view => {
                    if (view.id === `view-${targetView}`) {
                        view.classList.remove('hidden');
                    } else {
                        view.classList.add('hidden');
                    }
                });

                // Close detail panel when switching main views
                document.getElementById('detail-panel-container').classList.add('hidden');
            });
        });

        // Hide loading overlay after a delay (simulating load time)
        setTimeout(() => {
            const loadingOverlay = document.getElementById('loading-overlay');
            loadingOverlay.style.opacity = '0';
            setTimeout(() => loadingOverlay.style.display = 'none', 300);
        }, 1500);
        
        // --- Firebase placeholder ---
        console.log("UI Initialized. Firebase logic would go here.");
        // All the detailed Firebase logic from the original file would be integrated here,
        // modified to populate the new templates and handle the slide-in panel instead of modals.
        // For brevity in this example, the full Firebase implementation is omitted but the structure is ready for it.
    });
    </script>
</body>
</html>
