<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Placement Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Custom styles for the grid and interactions */
        body {
            font-family: 'Roboto Mono', monospace;
            overscroll-behavior: none;
            background-color: #0d1117;
        }
        main {
            cursor: grab;
            overflow: auto; /* Changed for custom scrollbar */
            background-color: #0d1117;
        }
        main:active {
            cursor: grabbing;
        }
        /* Custom Scrollbar Styling */
        main::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }
        main::-webkit-scrollbar-track {
            background: #010409;
        }
        main::-webkit-scrollbar-thumb {
            background-color: #30363d;
            border-radius: 20px;
            border: 3px solid #010409;
        }
        main::-webkit-scrollbar-corner {
            background: #010409;
        }

        #map-grid-container {
            position: relative;
            transform-origin: top left;
            transition: transform 0.2s ease-out;
        }
        #map-grid {
            display: grid;
            grid-template-columns: repeat(150, 12px);
            grid-template-rows: repeat(75, 12px);
            /* Emphasized border */
            border: 3px solid #30363d;
            width: 1806px; /* 150 * 12 + 6px border */
            height: 906px; /* 75 * 12 + 6px border */
            background-color: #010409;
        }
        .grid-cell {
            width: 12px;
            height: 12px;
            border-right: 1px solid #21262d;
            border-bottom: 1px solid #21262d;
            box-sizing: border-box;
        }
        .grid-cell:nth-child(150n) {
            border-right: none;
        }
        .grid-cell:nth-last-child(-n+150) {
            border-bottom: none;
        }
        .remove-hover {
            background-color: rgba(248, 81, 73, 0.6);
            outline: 1px solid rgba(248, 81, 73, 0.9);
        }
        .remove-start-marker {
             background-color: rgba(248, 81, 73, 0.8);
             outline: 2px solid white;
        }
        .divider-border {
            border-right: 2px solid #f778ba; /* Neon pink */
        }
        .removed-cell {
            background-color: #010409;
            border: none !important;
        }
        #structure-layer, #hover-layer {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 1800px;
            height: 900px;
            pointer-events: none;
        }
        .structure-block, .hover-block {
            position: absolute;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 5px black;
            white-space: nowrap;
        }
        .hover-block {
             background-color: rgba(253, 224, 71, 0.5);
             border: 1px solid rgba(253, 224, 71, 0.8);
        }
        .color-swatch {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 0.25rem;
            cursor: pointer;
            border: 2px solid #30363d;
            transition: all 0.2s ease-in-out;
        }
        .color-swatch:hover {
            transform: scale(1.1);
            box-shadow: 0 0 10px var(--glow-color);
        }
        .color-swatch.selected {
            border-color: white;
            transform: scale(1.1);
            box-shadow: 0 0 15px var(--glow-color);
        }
        /* Minimap styles */
        #minimap-container {
            position: relative;
            width: 100%;
            padding-top: 50%; /* 2:1 aspect ratio */
            background-color: #010409;
            border: 1px solid #30363d;
            cursor: pointer;
            border-radius: 4px;
        }
        #minimap-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #minimap-viewport {
            position: absolute;
            border: 1px solid white;
            background-color: rgba(255, 255, 255, 0.2);
            pointer-events: none;
        }
        .sidebar-btn {
            background-color: #21262d;
            border: 1px solid #30363d;
            transition: all 0.2s ease-in-out;
        }
        .sidebar-btn:hover {
            background-color: #30363d;
            box-shadow: 0 0 10px var(--glow-color);
            color: white;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-300 flex h-screen overflow-hidden">

    <aside class="w-72 bg-[#0d1117] p-6 flex flex-col shadow-lg flex-shrink-0 overflow-y-auto border-r border-gray-800">
        <h1 class="text-2xl font-bold text-center mb-6 text-white">Tactical Map</h1>
        
        <div class="mb-4">
            <h3 class="text-lg font-semibold text-center mb-3 text-gray-400">Place HQ (3x3)</h3>
            <div id="hq-color-palette" class="grid grid-cols-4 gap-2 justify-items-center">
                </div>
        </div>

        <div class="flex flex-col space-y-4">
            <button id="ac-btn" class="sidebar-btn w-full text-white font-bold py-3 px-4 rounded-lg" style="--glow-color: #22c55e;">
                Place Alliance Center (9x9)
            </button>
            <button id="remove-structure-btn" class="sidebar-btn w-full text-white font-bold py-3 px-4 rounded-lg" style="--glow-color: #9333ea;">
                Remove Structure
            </button>
            <button id="remove-btn" class="sidebar-btn w-full text-white font-bold py-3 px-4 rounded-lg" style="--glow-color: #dc2626;">
                Remove Terrain
            </button>
            <button id="clear-btn" class="sidebar-btn w-full text-white font-bold py-3 px-4 rounded-lg" style="--glow-color: #9ca3af;">
                Clear Selection
            </button>
        </div>
        
        <hr class="border-gray-800 my-6">

        <div>
            <h2 class="text-lg font-semibold mb-3 text-gray-400">Navigation</h2>
            <div id="minimap-container">
                <canvas id="minimap-canvas"></canvas>
                <div id="minimap-viewport"></div>
            </div>
            <div class="flex items-center justify-center space-x-4 mt-3">
                <button id="zoom-out-btn" class="w-10 h-10 bg-gray-800 hover:bg-gray-700 rounded-full font-bold text-xl">-</button>
                <span id="zoom-display" class="text-sm font-semibold w-16 text-center">100%</span>
                <button id="zoom-in-btn" class="w-10 h-10 bg-gray-800 hover:bg-gray-700 rounded-full font-bold text-xl">+</button>
            </div>
        </div>

        <hr class="border-gray-800 my-6">

        <div>
            <h2 class="text-lg font-semibold mb-3 text-gray-400">Map Data</h2>
            <div class="flex flex-col space-y-4">
                <button id="export-btn" class="sidebar-btn w-full text-white font-bold py-3 px-4 rounded-lg" style="--glow-color: #4f46e5;">Export Map State</button>
                <div>
                    <label for="map-state-input" class="block text-sm font-medium text-gray-400 mb-1">Map State Data</label>
                    <textarea id="map-state-input" rows="4" class="w-full bg-[#010409] border border-gray-700 rounded-lg px-3 py-2 text-white text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Paste map data here..."></textarea>
                </div>
                <button id="load-btn" class="sidebar-btn w-full text-white font-bold py-3 px-4 rounded-lg" style="--glow-color: #2dd4bf;">Load State</button>
            </div>
        </div>

        <div class="text-sm text-gray-500 mt-auto pt-6">
            <p><span class="font-bold">Coords:</span> <span id="coords-display">N/A</span></p>
            <p id="help-text" class="mt-2">Select a tool to begin.</p>
        </div>
    </aside>

    <main class="flex-1 p-4 flex items-center justify-center">
        <div id="map-grid-container">
            <div id="map-grid" class="cursor-crosshair"></div>
            <div id="structure-layer"></div>
            <div id="hover-layer"></div>
        </div>
    </main>

    <div id="ac-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center hidden z-50">
        <div class="bg-[#0d1117] border border-gray-700 rounded-lg shadow-xl p-8 w-full max-w-md">
            <h2 class="text-2xl font-bold mb-4 text-white">Alliance Center Details</h2>
            <form id="ac-form">
                <div>
                    <label for="ac-name-input" class="block text-sm font-medium text-gray-400 mb-1">Alliance Name</label>
                    <input type="text" id="ac-name-input" class="w-full bg-[#010409] border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="e.g., The Phoenix Legion" required>
                </div>
                <div class="mt-4">
                    <label class="block text-sm font-medium text-gray-400 mb-2">Alliance Color</label>
                    <div id="ac-color-palette" class="grid grid-cols-4 gap-4 justify-items-center">
                        </div>
                </div>
                <div class="mt-6 flex justify-end space-x-4">
                    <button type="button" id="cancel-ac-btn" class="sidebar-btn px-6 py-2 rounded-lg" style="--glow-color: #9ca3af;">Cancel</button>
                    <button type="submit" class="sidebar-btn px-6 py-2 rounded-lg font-semibold" style="--glow-color: #22c55e;">Confirm</button>
                </div>
            </form>
        </div>
    </div>
    <div id="export-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center hidden z-50">
        <div class="bg-[#0d1117] border border-gray-700 rounded-lg shadow-xl p-8 w-full max-w-2xl">
            <h2 class="text-2xl font-bold mb-4 text-white">Exported Map Data</h2>
            <p class="text-gray-400 mb-6">Copy the text below to save your current map layout.</p>
            <textarea id="export-output" rows="10" readonly class="w-full bg-[#010409] border border-gray-700 rounded-lg px-3 py-2 text-white font-mono"></textarea>
            <div class="mt-6 flex justify-end space-x-4">
                 <button id="copy-export-btn" class="sidebar-btn px-6 py-2 rounded-lg font-semibold" style="--glow-color: #4f46e5;">Copy to Clipboard</button>
                <button id="close-export-btn" class="sidebar-btn px-6 py-2 rounded-lg" style="--glow-color: #9ca3af;">Close</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- CONFIGURATION ---
            const GRID_WIDTH = 150;
            const GRID_HEIGHT = 75;
            const CELL_SIZE = 12;
            const ZOOM_LEVELS = [0.25, 0.5, 0.75, 1, 1.5, 2];
            const COLOR_PALETTE = {
                NEON_CYAN: { color: '#22d3ee', borderColor: '#a5f3fc' },
                HOT_PINK: { color: '#f472b6', borderColor: '#fbcfe8' },
                LIME_GREEN: { color: '#a3e635', borderColor: '#d9f99d' },
                ELECTRIC_BLUE: { color: '#38bdf8', borderColor: '#bae6fd' },
                SOLAR_ORANGE: { color: '#fb923c', borderColor: '#fed7aa' },
                GALACTIC_PURPLE: { color: '#a78bfa', borderColor: '#ddd6fe' },
                GOLD: { color: '#facc15', borderColor: '#fef08a' },
                CRIMSON: { color: '#f43f5e', borderColor: '#fda4af' },
            };
            const STRUCTURES = {
                ...Object.keys(COLOR_PALETTE).reduce((acc, key) => {
                    acc[`HQ_${key}`] = { name: `HQ_${key}`, width: 3, height: 3, ...COLOR_PALETTE[key] };
                    return acc;
                }, {}),
                ALLIANCE_CENTER: { name: 'ALLIANCE_CENTER', width: 9, height: 9 },
                REMOVE: { name: 'Remove Terrain' },
                REMOVE_STRUCTURE: { name: 'Remove Structure' }
            };
            // --- DEFAULT STATE ---
            const defaultMapStateJSON = `{"structures":[],"removed":[]}`;

            // --- DOM ELEMENTS ---
            const mainMapArea = document.querySelector('main');
            const grid = document.getElementById('map-grid');
            const structureLayer = document.getElementById('structure-layer');
            const hoverLayer = document.getElementById('hover-layer');
            const coordsDisplay = document.getElementById('coords-display');
            const helpText = document.getElementById('help-text');
            const hqPalette = document.getElementById('hq-color-palette');
            const acBtn = document.getElementById('ac-btn');
            const removeBtn = document.getElementById('remove-btn');
            const removeStructureBtn = document.getElementById('remove-structure-btn');
            const clearBtn = document.getElementById('clear-btn');
            const exportBtn = document.getElementById('export-btn');
            const loadBtn = document.getElementById('load-btn');
            const mapStateInput = document.getElementById('map-state-input');
            const minimapContainer = document.getElementById('minimap-container');
            const minimapCanvas = document.getElementById('minimap-canvas');
            const minimapViewport = document.getElementById('minimap-viewport');
            const zoomInBtn = document.getElementById('zoom-in-btn');
            const zoomOutBtn = document.getElementById('zoom-out-btn');
            const zoomDisplay = document.getElementById('zoom-display');
            
            // Modals
            const acModal = document.getElementById('ac-modal');
            const acForm = document.getElementById('ac-form');
            const acNameInput = document.getElementById('ac-name-input');
            const acPalette = document.getElementById('ac-color-palette');
            const cancelAcBtn = document.getElementById('cancel-ac-btn');
            const exportModal = document.getElementById('export-modal');
            const exportOutput = document.getElementById('export-output');
            const closeExportBtn = document.getElementById('close-export-btn');
            const copyExportBtn = document.getElementById('copy-export-btn');

            // --- STATE ---
            let selectedStructure = null;
            let gridCells = [];
            let removeFirstClickCoords = null;
            let mapData = { structures: [], removed: [] };
            let isPanning = false;
            let startX, startY, scrollLeft, scrollTop;
            let selectedAcColor = COLOR_PALETTE.GREEN; // Default AC color
            let currentZoomIndex = ZOOM_LEVELS.indexOf(1);

            // --- INITIALIZATION ---
            function createGrid() {
                const fragment = document.createDocumentFragment();
                for (let y = 0; y < GRID_HEIGHT; y++) {
                    for (let x = 0; x < GRID_WIDTH; x++) {
                        const cell = document.createElement('div');
                        cell.classList.add('grid-cell');
                        cell.dataset.x = x;
                        cell.dataset.y = y;
                        if (x === 74) cell.classList.add('divider-border');
                        fragment.appendChild(cell);
                        gridCells.push(cell);
                    }
                }
                grid.appendChild(fragment);
            }
            
            function createColorPalette(container, onSelect) {
                container.innerHTML = '';
                Object.keys(COLOR_PALETTE).forEach(key => {
                    const swatch = document.createElement('div');
                    swatch.className = 'color-swatch';
                    swatch.style.backgroundColor = COLOR_PALETTE[key].color;
                    swatch.style.setProperty('--glow-color', COLOR_PALETTE[key].borderColor);
                    swatch.dataset.colorKey = key;
                    swatch.addEventListener('click', () => onSelect(key, swatch));
                    container.appendChild(swatch);
                });
            }

            // --- STATE MANAGEMENT & RENDERING ---
            function renderMapFromState() {
                // Clear all visual elements first
                structureLayer.innerHTML = '';
                gridCells.forEach(cell => {
                    cell.className = 'grid-cell'; // Reset to base class
                    if (parseInt(cell.dataset.x) === 74) cell.classList.add('divider-border');
                });

                const removedSet = new Set(mapData.removed.map(c => `${c.x},${c.y}`));
                
                // Render removed cells
                mapData.removed.forEach(coords => {
                    const cell = getCell(coords.x, coords.y);
                    if (cell) cell.classList.add('removed-cell');
                });

                // Render structures on top
                mapData.structures.forEach(struct => {
                    renderStructureBlock(struct);
                });
                
                // Emphasize borders on buildable land next to removed terrain
                gridCells.forEach(cell => {
                    if (cell.classList.contains('removed-cell')) return;

                    const x = parseInt(cell.dataset.x);
                    const y = parseInt(cell.dataset.y);
                    
                    const borderColor = '#9ca3af'; // Brighter grey

                    // Check neighbors
                    if (removedSet.has(`${x},${y - 1}`)) { // Neighbor above is removed
                        cell.style.borderTop = `1px solid ${borderColor}`;
                    }
                    if (removedSet.has(`${x},${y + 1}`)) { // Neighbor below is removed
                        cell.style.borderBottom = `1px solid ${borderColor}`;
                    }
                    if (removedSet.has(`${x - 1},${y}`)) { // Neighbor left is removed
                        cell.style.borderLeft = `1px solid ${borderColor}`;
                    }
                    if (removedSet.has(`${x + 1},${y}`)) { // Neighbor right is removed
                        cell.style.borderRight = `1px solid ${borderColor}`;
                    }
                });

                drawMinimap();
                updateMinimapViewport();
            }

            // --- UI & TEXT HELPERS ---
            function updateHelpText(state) {
                const messages = {
                    default: 'Select a tool to begin.',
                    remove_terrain: 'Click and drag to remove terrain.',
                    remove_structure: 'Click a structure to remove it.'
                };
                helpText.textContent = messages[state] || messages.default;
            }

            // --- EVENT HANDLERS ---
            function handleStructureSelect(structure, btn) {
                selectedStructure = structure;
                
                // Clear all other selections
                document.querySelectorAll('.selected, .ring-2').forEach(el => el.classList.remove('selected', 'ring-2', 'ring-offset-2', 'ring-offset-gray-800'));
                
                if (btn) {
                    btn.classList.add(btn.classList.contains('color-swatch') ? 'selected' : 'ring-2');
                    if (!btn.classList.contains('color-swatch')) {
                         btn.classList.add('ring-offset-2', 'ring-offset-gray-800');
                    }
                }

                if (structure.name !== 'Remove Terrain' && removeFirstClickCoords) {
                    const firstCell = getCell(removeFirstClickCoords.x, removeFirstClickCoords.y);
                    if (firstCell) firstCell.classList.remove('remove-start-marker');
                    removeFirstClickCoords = null;
                }

                if (structure.name === 'Remove Terrain') updateHelpText('remove_terrain');
                else if (structure.name === 'Remove Structure') updateHelpText('remove_structure');
                else updateHelpText('default');
            }
            
            function handleClearSelection() {
                if (removeFirstClickCoords) {
                    const firstCell = getCell(removeFirstClickCoords.x, removeFirstClickCoords.y);
                    if (firstCell) firstCell.classList.remove('remove-start-marker');
                    removeFirstClickCoords = null;
                }
                selectedStructure = null;
                document.querySelectorAll('.selected, .ring-2').forEach(el => el.classList.remove('selected', 'ring-2', 'ring-offset-2', 'ring-offset-gray-800'));
                clearHover();
                updateHelpText('default');
            }

            function handleGridMouseOver(e) {
                const cell = e.target;
                if (!cell.classList.contains('grid-cell')) return;
                const gridX = parseInt(cell.dataset.x);
                const gridY = parseInt(cell.dataset.y);

                // Invert Y-axis for display to make (0,0) bottom-left
                const displayY = GRID_HEIGHT - 1 - gridY;
                coordsDisplay.textContent = `${gridX}, ${displayY}`;

                if (selectedStructure) {
                    clearHover();
                    showHover(gridX, gridY);
                }
            }
            
            function handleGridMouseOut() {
                coordsDisplay.textContent = 'N/A';
                clearHover();
            }

            function handleGridClick(e) {
                const cell = e.target;
                if (!cell.classList.contains('grid-cell')) return;
                const x = parseInt(cell.dataset.x);
                const y = parseInt(cell.dataset.y);
                
                if (selectedStructure) {
                    if (selectedStructure.name === 'Remove Terrain') {
                        handleRemoveTerrainClick(x, y);
                        return;
                    }
                    if (selectedStructure.name === 'Remove Structure') {
                        handleRemoveStructureClick(x, y);
                        return;
                    }

                    const { startX, startY } = getPlacementBounds(x, y, selectedStructure);
                    
                    if (validatePlacement(startX, startY, selectedStructure)) {
                        if (selectedStructure.name.startsWith('HQ_')) {
                            addStructureToData(startX, startY, selectedStructure, ''); // No label for HQs
                        } else if (selectedStructure.name === 'ALLIANCE_CENTER') {
                            placementCoords = { x: startX, y: startY };
                            acModal.classList.remove('hidden');
                            acNameInput.focus();
                        }
                    }
                }
            }
            
            function handleRemoveStructureClick(x, y) {
                let structureRemoved = false;
                const originalLength = mapData.structures.length;
                mapData.structures = mapData.structures.filter(s => {
                    const sType = STRUCTURES[s.type];
                    const sMaxX = s.x + sType.width - 1;
                    const sMaxY = s.y + sType.height - 1;
                    const isClicked = (x >= s.x && x <= sMaxX && y >= s.y && y <= sMaxY);
                    return !isClicked;
                });

                if (mapData.structures.length < originalLength) {
                    renderMapFromState();
                }
            }

            function handleRemoveTerrainClick(x, y) {
                 // Prevent removing terrain under a structure
                for (const s of mapData.structures) {
                    const sType = STRUCTURES[s.type];
                    const sMaxX = s.x + sType.width - 1;
                    const sMaxY = s.y + sType.height - 1;
                    if (x >= s.x && x <= sMaxX && y >= s.y && y <= sMaxY) {
                        return; // Do nothing if clicking on a structure
                    }
                }

                if (removeFirstClickCoords === null) {
                    removeFirstClickCoords = { x, y };
                    getCell(x, y).classList.add('remove-start-marker');
                    updateHelpText('remove_second');
                } else {
                    const { x: x1, y: y1 } = removeFirstClickCoords;
                    const minX = Math.min(x1, x);
                    const maxX = Math.max(x1, x);
                    const minY = Math.min(y1, y);
                    const maxY = Math.max(y1, y);
                    addRemovedAreaToData(minX, minY, maxX, maxY);
                    
                    const firstCell = getCell(x1, y1);
                    if (firstCell) firstCell.classList.remove('remove-start-marker');
                    removeFirstClickCoords = null;
                    clearHover();
                    updateHelpText('remove_first');
                }
            }

            function handleAcFormSubmit(e) {
                e.preventDefault();
                const name = acNameInput.value.trim();
                if (name) {
                    const acData = { ...STRUCTURES.ALLIANCE_CENTER, ...selectedAcColor };
                    addStructureToData(placementCoords.x, placementCoords.y, acData, name);
                    closeAcModal();
                }
            }

            function closeAcModal() {
                acModal.classList.add('hidden');
                acForm.reset();
            }

            // --- DATA MANIPULATION ---
            function addStructureToData(startX, startY, structure, label) {
                const newStruct = { 
                    type: structure.name, 
                    x: startX, 
                    y: startY, 
                    label: label,
                    color: structure.color,
                    borderColor: structure.borderColor
                };
                mapData.structures.push(newStruct);
                renderMapFromState();
            }

            function addRemovedAreaToData(minX, minY, maxX, maxY) {
                // Now add the new removed cells
                for (let i = minX; i <= maxX; i++) {
                    for (let j = minY; j <= maxY; j++) {
                        if (!mapData.removed.some(cell => cell.x === i && cell.y === j)) {
                            mapData.removed.push({ x: i, y: j });
                        }
                    }
                }
                renderMapFromState();
            }

            // --- DOM MANIPULATION (RENDERING) ---
            function renderStructureBlock(structData) {
                const structureType = STRUCTURES[structData.type];
                if (!structureType) return;

                const block = document.createElement('div');
                block.className = 'structure-block';
                block.style.left = `${structData.x * CELL_SIZE}px`;
                block.style.top = `${structData.y * CELL_SIZE}px`;
                block.style.width = `${structureType.width * CELL_SIZE}px`;
                block.style.height = `${structureType.height * CELL_SIZE}px`;
                block.style.border = `2px solid ${structData.borderColor || structureType.borderColor}`;
                block.style.backgroundColor = structData.color || structureType.color;
                block.textContent = structData.label;
                structureLayer.appendChild(block);
            }

            // --- HELPERS & VALIDATION ---
            function getCell(x, y) {
                if (x < 0 || x >= GRID_WIDTH || y < 0 || y >= GRID_HEIGHT) return null;
                return gridCells[y * GRID_WIDTH + x];
            }
            
            function getPlacementBounds(centerX, centerY, structure) {
                const startX = centerX - Math.floor(structure.width / 2);
                const startY = centerY - Math.floor(structure.height / 2);
                return { startX, startY };
            }

            function validatePlacement(startX, startY, structure) {
                const removedSet = new Set(mapData.removed.map(c => `${c.x},${c.y}`));
                for (let y = startY; y < startY + structure.height; y++) {
                    for (let x = startX; x < startX + structure.width; x++) {
                        if (x < 0 || x >= GRID_WIDTH || y < 0 || y >= GRID_HEIGHT) return false; // Out of bounds
                        if (removedSet.has(`${x},${y}`)) return false; // Overlaps manually removed area

                        // Check for collision with existing structures
                        for (const s of mapData.structures) {
                            const sType = STRUCTURES[s.type];
                            const sMaxX = s.x + sType.width - 1;
                            const sMaxY = s.y + sType.height - 1;
                            if (x >= s.x && x <= sMaxX && y >= s.y && y <= sMaxY) {
                                return false; // Collision detected
                            }
                        }
                    }
                }
                return true;
            }

            function showHover(centerX, centerY) {
                hoverLayer.innerHTML = ''; // Clear previous hover
                if (!selectedStructure) return;

                if (selectedStructure.name === 'Remove Terrain') {
                    if (removeFirstClickCoords) {
                         const { x: x1, y: y1 } = removeFirstClickCoords;
                        const minX = Math.min(x1, centerX);
                        const maxX = Math.max(x1, centerX);
                        const minY = Math.min(y1, centerY);
                        const maxY = Math.max(y1, centerY);
                        for (let i = minX; i <= maxX; i++) {
                            for (let j = minY; j <= maxY; j++) {
                                const cellToHover = getCell(i, j);
                                if (cellToHover) {
                                    cellToHover.classList.add('remove-hover');
                                }
                            }
                        }
                    }
                } else if (selectedStructure.name === 'Remove Structure') {
                    // Hover logic for removing a structure
                    for (const s of mapData.structures) {
                        const sType = STRUCTURES[s.type];
                        const sMaxX = s.x + sType.width - 1;
                        const sMaxY = s.y + sType.height - 1;
                        if (centerX >= s.x && centerX <= sMaxX && centerY >= s.y && centerY <= sMaxY) {
                            const hoverBlock = document.createElement('div');
                            hoverBlock.className = 'hover-block';
                            hoverBlock.style.left = `${s.x * CELL_SIZE}px`;
                            hoverBlock.style.top = `${s.y * CELL_SIZE}px`;
                            hoverBlock.style.width = `${sType.width * CELL_SIZE}px`;
                            hoverBlock.style.height = `${sType.height * CELL_SIZE}px`;
                            hoverBlock.style.backgroundColor = 'rgba(239, 68, 68, 0.6)';
                            hoverBlock.style.border = '1px solid rgba(239, 68, 68, 0.9)';
                            hoverLayer.appendChild(hoverBlock);
                            break; 
                        }
                    }
                } else {
                    const { startX, startY } = getPlacementBounds(centerX, centerY, selectedStructure);
                    if (validatePlacement(startX, startY, selectedStructure)) {
                        const hoverBlock = document.createElement('div');
                        hoverBlock.className = 'hover-block';
                        hoverBlock.style.left = `${startX * CELL_SIZE}px`;
                        hoverBlock.style.top = `${startY * CELL_SIZE}px`;
                        hoverBlock.style.width = `${selectedStructure.width * CELL_SIZE}px`;
                        hoverBlock.style.height = `${selectedStructure.height * CELL_SIZE}px`;
                        hoverLayer.appendChild(hoverBlock);
                    }
                }
            }

            function clearHover() {
                hoverLayer.innerHTML = '';
                grid.querySelectorAll('.remove-hover').forEach(c => c.classList.remove('remove-hover'));
            }

            // --- IMPORT / EXPORT LOGIC ---
            function exportMapState() {
                const stateString = JSON.stringify(mapData, null, 2);
                exportOutput.value = stateString;
                exportModal.classList.remove('hidden');
            }

            function loadMapState() {
                const stateString = mapStateInput.value;
                if (!stateString) {
                    alert('Map data is empty. Paste data into the text box to load a state.');
                    return;
                }
                try {
                    const newState = JSON.parse(stateString);
                    if (newState && typeof newState === 'object' && Array.isArray(newState.structures) && Array.isArray(newState.removed)) {
                        mapData = newState;
                        renderMapFromState();
                    } else {
                        throw new Error('Invalid map data structure.');
                    }
                } catch (error) {
                    alert('Error parsing map data. Please ensure it is valid JSON copied from the export tool.');
                    console.error("Failed to load map state:", error);
                }
            }
            
            // --- ZOOM LOGIC ---
            function applyZoom() {
                const scale = ZOOM_LEVELS[currentZoomIndex];
                document.getElementById('map-grid-container').style.transform = `scale(${scale})`;
                zoomDisplay.textContent = `${Math.round(scale * 100)}%`;
                updateMinimapViewport();
            }
            zoomInBtn.addEventListener('click', () => {
                if (currentZoomIndex < ZOOM_LEVELS.length - 1) {
                    currentZoomIndex++;
                    applyZoom();
                }
            });
            zoomOutBtn.addEventListener('click', () => {
                if (currentZoomIndex > 0) {
                    currentZoomIndex--;
                    applyZoom();
                }
            });

            // --- NAVIGATION LOGIC ---
            function drawMinimap() {
                const canvas = minimapCanvas;
                const ctx = canvas.getContext('2d');
                const scaleX = canvas.width / GRID_WIDTH;
                const scaleY = canvas.height / GRID_HEIGHT;

                // Clear and draw background
                ctx.fillStyle = '#2d3748'; // gray-700
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw removed areas
                ctx.fillStyle = '#1a202c'; // gray-900
                mapData.removed.forEach(cell => {
                    ctx.fillRect(cell.x * scaleX, cell.y * scaleY, scaleX, scaleY);
                });

                // Draw structures
                mapData.structures.forEach(struct => {
                    const sType = STRUCTURES[struct.type];
                    ctx.fillStyle = struct.color || sType.color;
                    ctx.fillRect(struct.x * scaleX, struct.y * scaleY, sType.width * scaleX, sType.height * scaleY);
                });
            }

            function updateMinimapViewport() {
                const scale = ZOOM_LEVELS[currentZoomIndex];
                const scaleX = minimapContainer.clientWidth / (mainMapArea.scrollWidth * scale);
                const scaleY = minimapContainer.clientHeight / (mainMapArea.scrollHeight * scale);

                minimapViewport.style.width = `${mainMapArea.clientWidth * scaleX}px`;
                minimapViewport.style.height = `${mainMapArea.clientHeight * scaleY}px`;
                minimapViewport.style.left = `${mainMapArea.scrollLeft * scaleX}px`;
                minimapViewport.style.top = `${mainMapArea.scrollTop * scaleY}px`;
            }

            minimapContainer.addEventListener('click', (e) => {
                const rect = minimapContainer.getBoundingClientRect();
                const scale = ZOOM_LEVELS[currentZoomIndex];
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const percentX = x / minimapContainer.clientWidth;
                const percentY = y / minimapContainer.clientHeight;

                mainMapArea.scrollTo({
                    left: (mainMapArea.scrollWidth * scale * percentX) - (mainMapArea.clientWidth / 2),
                    top: (mainMapArea.scrollHeight * scale * percentY) - (mainMapArea.clientHeight / 2),
                    behavior: 'smooth'
                });
            });

            mainMapArea.addEventListener('scroll', updateMinimapViewport);
            new ResizeObserver(updateMinimapViewport).observe(mainMapArea);

            // --- PANNING LOGIC ---
            mainMapArea.addEventListener('mousedown', (e) => {
                if (e.target.id !== 'map-grid' && !e.target.classList.contains('grid-cell')) return;
                isPanning = true;
                startX = e.pageX - mainMapArea.offsetLeft;
                scrollLeft = mainMapArea.scrollLeft;
                startY = e.pageY - mainMapArea.offsetTop;
                scrollTop = mainMapArea.scrollTop;
            });
            mainMapArea.addEventListener('mouseleave', () => { isPanning = false; });
            mainMapArea.addEventListener('mouseup', () => { isPanning = false; });
            mainMapArea.addEventListener('mousemove', (e) => {
                if (!isPanning) return;
                e.preventDefault();
                const scale = ZOOM_LEVELS[currentZoomIndex];
                const x = e.pageX - mainMapArea.offsetLeft;
                const walk = (x - startX) / scale;
                mainMapArea.scrollLeft = scrollLeft - walk;
                const y = e.pageY - mainMapArea.offsetTop;
                const walkY = (y - startY) / scale;
                mainMapArea.scrollTop = scrollTop - walkY;
            });

            // --- ATTACH EVENT LISTENERS ---
            acBtn.addEventListener('click', () => handleStructureSelect(STRUCTURES.ALLIANCE_CENTER, acBtn));
            removeBtn.addEventListener('click', () => handleStructureSelect(STRUCTURES.REMOVE, removeBtn));
            removeStructureBtn.addEventListener('click', () => handleStructureSelect(STRUCTURES.REMOVE_STRUCTURE, removeStructureBtn));
            clearBtn.addEventListener('click', handleClearSelection);
            exportBtn.addEventListener('click', exportMapState);
            loadBtn.addEventListener('click', loadMapState);
            grid.addEventListener('mouseover', handleGridMouseOver);
            grid.addEventListener('mouseout', handleGridMouseOut);
            grid.addEventListener('click', handleGridClick);
            acForm.addEventListener('submit', handleAcFormSubmit);
            cancelAcBtn.addEventListener('click', closeAcModal);
            closeExportBtn.addEventListener('click', () => exportModal.classList.add('hidden'));
            copyExportBtn.addEventListener('click', () => {
                exportOutput.select();
                document.execCommand('copy');
            });

            // --- START ---
            createGrid();
            createColorPalette(hqPalette, (key, swatch) => handleStructureSelect(STRUCTURES[`HQ_${key}`], swatch));
            createColorPalette(acPalette, (key, swatch) => {
                selectedAcColor = COLOR_PALETTE[key];
                acPalette.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
                swatch.classList.add('selected');
            });
            // Set default selection for AC palette
            acPalette.firstChild.classList.add('selected');

            if (defaultMapStateJSON) {
                mapStateInput.value = defaultMapStateJSON;
                loadMapState();
            }
        });
    </script>
</body>
</html>
